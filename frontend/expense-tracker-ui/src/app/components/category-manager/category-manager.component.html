<div class="category-container">
    <h1>Manage Categories</h1>

    <div class="add-category-form">
        <mat-form-field appearance="outline">
            <mat-label>New Category Name</mat-label>
            <input matInput [(ngModel)]="newCategoryName" (keyup.enter)="addCategory()">
        </mat-form-field>
        <button mat-raised-button color="primary" (click)="addCategory()" [disabled]="!newCategoryName.trim()">
            Add
        </button>
    </div>

    <mat-list>
        <mat-list-item *ngFor="let category of categories">
            <span matListItemTitle>{{ category.name }}</span>
            <button mat-icon-button color="warn" (click)="deleteCategory(category.id)">
                <mat-icon>delete</mat-icon>
            </button>
        </mat-list-item>
    </mat-list>
</div>
